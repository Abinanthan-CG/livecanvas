<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>At the Edge of Infinity</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }
  body {
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }
  #universe {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    cursor: grab;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #universe.dragging { cursor: grabbing; }
  #universe:focus-visible { outline: 1px solid #7c9eb644; outline-offset: -5px; }



  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }


</style>
</head>
<body>
<main aria-label="An illuminated river of orbital dust in deep space">
  <canvas id="universe" tabindex="0" aria-label="A lone traveler stands on an immense, curving band of white, blue, and red starlight." aria-describedby="instructions"></canvas>

</main>
<p class="sr-only" id="instructions">Drag to orbit the scene. Scroll or pinch to move closer. Double-click or press R to restore the composition. Press Space to pause the stars, and F for fullscreen.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('universe');
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const gaussian = (x, c, s) => Math.exp(-Math.pow((x - c) / s, 2));

  function getViewportSize() {
    return {
      w: Math.max(1, window.innerWidth || document.documentElement.clientWidth),
      h: Math.max(1, window.innerHeight || document.documentElement.clientHeight)
    };
  }

  function randomGenerator(seed) {
    return function() {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 2D Canvas fallback if WebGL is unavailable
  function fallback() {
    const replacement = document.createElement('canvas');
    replacement.id = 'universe';
    replacement.setAttribute('aria-label', canvas.getAttribute('aria-label'));
    canvas.replaceWith(replacement);

    function draw() {
      const { w, h } = getViewportSize();
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      replacement.width = w * dpr;
      replacement.height = h * dpr;
      const ctx = replacement.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      const rand = randomGenerator(8421);
      for (let i = 0; i < 2400; i++) {
        const x = rand() * w, y = rand() * h;
        const a = 0.08 + Math.pow(rand(), 4) * 0.7;
        ctx.fillStyle = `rgba(${100 + rand() * 120},${140 + rand() * 100},255,${a})`;
        ctx.fillRect(x, y, 0.5 + rand() * 0.8, 0.5 + rand() * 0.8);
      }

      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < 4200; i++) {
        const r = 1.8 + (i / 4200) * 8.2;
        const k = (r * r - 3.661 * 3.661) / 11.723;
        const blue = gaussian(r, 3.23, 0.40);
        const white = gaussian(r, 3.615, 0.095);
        const red = gaussian(r, 3.775, 0.10);
        const outer = gaussian(r, 5.15, 0.15);
        const glint = Math.pow(rand(), 11);
        const intensity = 0.35 + rand() * 0.7;
        const R = Math.min(255, (blue * 0.025 + white * 1.9 + red * 0.88 + outer * 0.62 + glint * 0.12) * 255);
        const G = Math.min(255, (blue * 0.18 + white * 2.0 + red * 0.07 + outer * 0.03 + glint * 0.26) * 255);
        const B = Math.min(255, (blue * 0.52 + white * 2.2 + red * 0.015 + outer * 0.01 + glint * 0.55) * 255);
        ctx.strokeStyle = `rgba(${R},${G},${B},${intensity})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        let started = false;
        for (let y = -0.1; y <= 1.12; y += 0.008) {
          const b = 0.483 - 1.86 * (y - 0.43) * (y - 0.43);
          const d = y + 0.397;
          const discriminant = Math.pow(1 + 1.8 * k * d, 2) - 3.24 * k * (b + k * d * d);
          if (discriminant < 0) { started = false; continue; }
          const x = (2 * (b + k * d * d)) / (1 + 1.8 * k * d + Math.sqrt(discriminant));
          if (x < -0.15 || x > 1.15) { started = false; continue; }
          if (!started) ctx.moveTo(x * w, y * h);
          else ctx.lineTo(x * w, y * h);
          started = true;
        }
        ctx.stroke();
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0.315 * w, 0);
      ctx.bezierCurveTo(0.325 * w, 0.13 * h, 0.365 * w, 0.19 * h, 0.39 * w, 0.265 * h);
      ctx.bezierCurveTo(0.415 * w, 0.39 * h, 0.20 * w, 0.49 * h, 0, 0.51 * h);
      ctx.closePath();
      ctx.fill();
    }
    draw();
    window.addEventListener('resize', draw);
  }

  if (!window.THREE) {
    fallback();
    return;
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas,
      // The post pipeline renders a single fullscreen quad to the screen, so MSAA
      // adds a 4x-sampled color buffer for zero visible gain. Saves ~50MB GPU memory.
      antialias: false,
      alpha: false,
      // On dual-GPU laptops this prefers the iGPU: far smaller driver context,
      // less battery/heat. Revert to 'high-performance' if idle drift stutters.
      powerPreference: 'low-power'
    });
  } catch (error) {
    fallback();
    return;
  }

  renderer.setClearColor(0x000000, 1);
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;

  const lightDevice = window.innerWidth < 740 || (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 5);
  const random = randomGenerator(19470621);
  const scene = new THREE.Scene();
  const foreground = new THREE.Scene();

  // Off-axis rolled conic perspective tuned to match stary.jpg
  // while scaling isotropically to fit 16:9 / 16:10 laptop screens edge-to-edge.
  const q = 0.225;
  const horizonOffset = 0.397;
  const norm = Math.sqrt(1 + q * q);
  const major = q + 1 / q;
  const conicScale = (major * major) / 7.44;
  const focalCenterProduct = conicScale / (2 * q);
  const constant = (2 * focalCenterProduct - 2 * major * major * 0.43) / (2 * major);
  const screenOffset = constant - horizonOffset / q;
  const focalTimesNorm = Math.sqrt(
    conicScale * (-1.932 + 7.44 * 0.43 * 0.43) -
    constant * constant + 2 * focalCenterProduct * horizonOffset
  );
  const focal = focalTimesNorm / norm;
  const centerX = -1 / q;
  const centerZ = focalCenterProduct / focalTimesNorm;
  const outerRadius = Math.sqrt(centerZ * centerZ + 4 * conicScale * 1.123);
  const principalX = (-screenOffset + q * horizonOffset) / (norm * norm);
  const principalY = (-q * screenOffset - horizonOffset) / (norm * norm);
  const roll = Math.atan(q);

  const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.018, 1500);
  camera.position.set(0, 1, 0);
  camera.up.set(-Math.sin(roll), Math.cos(roll), 0);
  const lookTarget = new THREE.Vector3(0, 1, -4);
  camera.lookAt(lookTarget);

  // Isotropic off-axis conic projection framed to match the reference composition:
  // preserves the full vertical focal length (2 * focal) with 1:1 pixel aspect ratio
  // and pans horizontally so the traveler sits in the lower-left and the sweeping
  // white/red arc fills the right-center frame.
  function updateProjection() {
    const { w, h } = getViewportSize();
    const aspect = w / h;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();

    const xLeft = 0.658;
    const m = camera.projectionMatrix.elements;
    m[0] = (2 * focal) / aspect;
    m[5] = 2 * focal;
    m[8] = 1 - (2 * (principalX - xLeft)) / aspect;
    m[9] = 2 * principalY - 1;
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    camera.updateMatrixWorld(true);
  }
  updateProjection();

  function surfaceHeight(r) {
    const a = 2.65 / Math.max(r, 0.5);
    return Math.min(64, 0.07 * Math.pow(a, 10));
  }

  function surfacePoint(u, v, lift = 0) {
    const xp = u * 4;
    const divisor = v - q * xp + horizonOffset;
    const bx = (xp + q * v + screenOffset) / divisor;
    const bz = focalTimesNorm / divisor;
    let height = 0, x = bx, z = bz;
    for (let i = 0; i < 5; i++) {
      x = bx * (1 - height);
      z = bz * (1 - height);
      height = surfaceHeight(Math.hypot(x - centerX, z - centerZ)) + lift;
    }
    return new THREE.Vector3(x, height, -z);
  }

  // High-resolution 1D radial texture for crisp concentric orbital threads & funnel streaks
  const radialWidth = Math.min(lightDevice ? 8192 : 12288, renderer.capabilities.maxTextureSize);
  const radialPixels = new Uint8Array(radialWidth * 4);
  const coarseNoise = new Float32Array(Math.ceil(radialWidth / 23) + 2);
  for (let i = 0; i < coarseNoise.length; i++) coarseNoise[i] = random();

  for (let i = 0; i < radialWidth; i++) {
    const t = i / 23;
    const index = Math.floor(t);
    const f = t - index;
    const smooth = f * f * (3 - 2 * f);
    const broad = coarseNoise[index] * (1 - smooth) + coarseNoise[index + 1] * smooth;
    const detail = 0.14 + 0.86 * (0.62 * Math.pow(random(), 1.15) + 0.38 * broad);
    const rare = random();
    radialPixels[i * 4] = detail * 255;
    radialPixels[i * 4 + 1] = (rare < 0.125 ? 0.25 + 0.75 * random() : rare < 0.32 ? random() * 0.085 : 0) * 255;
    radialPixels[i * 4 + 2] = random() * 255;
    radialPixels[i * 4 + 3] = broad * 255;
  }

  const radialTexture = new THREE.DataTexture(radialPixels, radialWidth, 1, THREE.RGBAFormat);
  radialTexture.wrapS = THREE.RepeatWrapping;
  radialTexture.magFilter = THREE.LinearFilter;
  radialTexture.minFilter = THREE.LinearMipmapLinearFilter;
  radialTexture.generateMipmaps = true;
  radialTexture.needsUpdate = true;

  // Color palette calibrated to stary.jpg (sky-blues, crisp whites, fiery orange-reds, teal/gold glints)
  const palette = [
    [0.25, 0.56, 1.00], // vivid sky blue
    [0.12, 0.36, 0.90], // deep azure blue
    [0.58, 0.80, 1.00], // ice blue-white
    [0.95, 0.98, 1.00], // pure starlight white
    [0.10, 0.30, 0.78], // cobalt blue
    [1.00, 0.14, 0.03], // fiery orange-red
    [0.06, 0.68, 0.54], // subtle emerald-teal glint
    [1.00, 0.56, 0.14]  // warm amber-gold glint
  ];

  function chooseColor(t) {
    if (t < 0.28) return palette[0];
    if (t < 0.47) return palette[1];
    if (t < 0.64) return palette[2];
    if (t < 0.77) return palette[3];
    if (t < 0.84) return palette[4];
    if (t < 0.94) return palette[5];
    if (t < 0.98) return palette[6];
    return palette[7];
  }

  // Fine directional grain texture for outer concentric particle streaks
  const grainWidth = 1024, grainHeight = 512;
  const grainPixels = new Uint8Array(grainWidth * grainHeight * 4);
  for (let i = 0; i < grainWidth * grainHeight; i++) grainPixels[i * 4 + 3] = 255;

  for (let i = 0; i < 22000; i++) {
    const x = Math.floor(random() * grainWidth);
    const y = Math.floor(random() * grainHeight);
    const color = chooseColor(random());
    const brightness = 0.22 + Math.pow(random(), 1.9) * 0.82;
    const length = random() < 0.16 ? 5 : random() < 0.48 ? 2 : 1;
    for (let j = 0; j < length; j++) {
      const idx = (y * grainWidth + ((x + j) % grainWidth)) * 4;
      const gain = brightness * Math.pow(1 - j / length, 1.75) * 255;
      grainPixels[idx] = Math.max(grainPixels[idx], color[0] * gain);
      grainPixels[idx + 1] = Math.max(grainPixels[idx + 1], color[1] * gain);
      grainPixels[idx + 2] = Math.max(grainPixels[idx + 2], color[2] * gain);
    }
  }

  const grainTexture = new THREE.DataTexture(grainPixels, grainWidth, grainHeight, THREE.RGBAFormat);
  grainTexture.wrapS = grainTexture.wrapT = THREE.RepeatWrapping;
  grainTexture.magFilter = THREE.LinearFilter;
  grainTexture.minFilter = THREE.LinearMipmapLinearFilter;
  grainTexture.generateMipmaps = true;
  grainTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  grainTexture.needsUpdate = true;

  // Optimized concentric orbital surface mesh
  const innerSteps = lightDevice ? 150 : 210;
  const outerSteps = lightDevice ? 48 : 68;
  const angularSteps = lightDevice ? 360 : 540;
  const radialSteps = innerSteps + outerSteps;
  const positions = new Float32Array((radialSteps + 1) * (angularSteps + 1) * 3);
  const uvs = new Float32Array((radialSteps + 1) * (angularSteps + 1) * 2);
  const indices = new Uint32Array(radialSteps * angularSteps * 6);

  for (let i = 0; i <= radialSteps; i++) {
    const r = i <= innerSteps
      ? 1.45 + ((4.7 - 1.45) * i) / innerSteps
      : 4.7 + ((22 - 4.7) * (i - innerSteps)) / outerSteps;
    const height = surfaceHeight(r);
    for (let j = 0; j <= angularSteps; j++) {
      const theta = (j / angularSteps) * TAU - Math.PI;
      const n = i * (angularSteps + 1) + j;
      positions[n * 3] = centerX + r * Math.cos(theta);
      positions[n * 3 + 1] = height;
      positions[n * 3 + 2] = -centerZ - r * Math.sin(theta);
      uvs[n * 2] = r;
      uvs[n * 2 + 1] = theta;
    }
  }

  let ii = 0;
  for (let i = 0; i < radialSteps; i++) {
    for (let j = 0; j < angularSteps; j++) {
      const a = i * (angularSteps + 1) + j;
      const b = a + angularSteps + 1;
      indices[ii++] = a;
      indices[ii++] = b;
      indices[ii++] = a + 1;
      indices[ii++] = b;
      indices[ii++] = b + 1;
      indices[ii++] = a + 1;
    }
  }

  const discGeometry = new THREE.BufferGeometry();
  discGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  discGeometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  discGeometry.setIndex(new THREE.BufferAttribute(indices, 1));

  const discMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uRadial: { value: radialTexture },
      uGrain: { value: grainTexture },
      uTime: { value: 0 },
      uWhite: { value: centerZ },
      uOuter: { value: outerRadius }
    },
    extensions: { derivatives: true },
    side: THREE.DoubleSide,
    vertexShader: `
      varying float vRadius;
      varying float vTheta;
      varying float vDepth;
      varying vec3 vWorldPos;
      void main() {
        vRadius = uv.x;
        vTheta = uv.y;
        vWorldPos = position;
        vec4 viewPos = modelViewMatrix * vec4(position, 1.0);
        vDepth = -viewPos.z;
        gl_Position = projectionMatrix * viewPos;
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform sampler2D uRadial;
      uniform sampler2D uGrain;
      uniform float uTime;
      uniform float uWhite;
      uniform float uOuter;
      varying float vRadius;
      varying float vTheta;
      varying float vDepth;
      varying vec3 vWorldPos;

      float bell(float x, float center, float width) {
        float v = (x - center) / width;
        return exp(-v * v);
      }

      void main() {
        float r = vRadius;
        float theta = vTheta - uTime * 0.010 / pow(max(r, 0.5), 1.25);
        float distortion = 0.00022 * sin(theta * 31.0 + r * 15.0)
                         + 0.00010 * sin(theta * 103.0 + r * 22.0);
        vec4 thread = texture2D(uRadial, vec2((r + distortion) / 16.0, 0.5));
        float structure = 0.25 + 1.72 * thread.r * thread.r;
        float softStructure = 0.74 + 0.54 * thread.r;

        // Sky-blue to ice-blue inner slope matching stary.jpg
        vec3 color = vec3(0.036, 0.165, 0.435) *
          bell(r, uWhite - 0.43, 0.415) * structure;
        color += vec3(0.010, 0.038, 0.125) *
          bell(r, uWhite - 0.78, 0.31) * structure;
        color += vec3(0.22, 0.41, 0.64) *
          bell(r, uWhite - 0.16, 0.16) * softStructure;

        // Brilliant starlight white core band where the traveler stands
        color += vec3(2.68, 2.82, 3.12) *
          bell(r, uWhite - 0.045, 0.095) * softStructure;

        // Fiery orange-red primary rim
        color += vec3(1.06, 0.11, 0.022) *
          bell(r, uWhite + 0.112, 0.094) * (0.48 + 1.25 * thread.r * thread.r);
        color += vec3(0.18, 0.022, 0.010) *
          bell(r, uWhite + 0.24, 0.145) * structure;

        // Secondary outer red-orange arc sweeping across the middle-right field
        float outerThread = 0.14 + 2.6 * thread.r * thread.r * thread.r;
        color += vec3(0.86, 0.055, 0.014) *
          bell(r, uOuter - 0.025, 0.148) * outerThread;
        color += vec3(0.28, 0.062, 0.020) *
          bell(r, uOuter + 0.15, 0.058) * outerThread;
        color += vec3(0.14, 0.014, 0.010) *
          bell(r, uOuter - 0.23, 0.082) * structure;

        // Upper-left funnel & concentric ring orbital streaks
        float phase = theta * 2100.0 + r * 213.0;
        float pulse = pow(0.5 + 0.5 * sin(phase), 19.0);
        pulse = mix(pulse, 0.14, smoothstep(0.9, 4.5, fwidth(phase)));

        vec3 threadColor;
        if (thread.b < 0.72) {
          threadColor = mix(vec3(0.10, 0.28, 0.60), vec3(0.60, 0.76, 0.92), thread.b / 0.72);
        } else if (thread.b < 0.87) {
          threadColor = vec3(0.72, 0.065, 0.024);
        } else if (thread.b < 0.94) {
          threadColor = vec3(0.055, 0.44, 0.34);
        } else {
          threadColor = vec3(0.56, 0.34, 0.11);
        }

        float longVariation = 0.65 + 0.35 * sin(theta * 9.0 + r * 43.0);
        color += threadColor * thread.g * (0.16 + 0.92 * pulse) * longVariation;

        vec3 grains = texture2D(uGrain, vec2(theta * 0.72, r * 0.83)).rgb;
        color += grains * (0.25 + 0.50 * smoothstep(3.8, 5.6, r));
        color *= 1.0 - smoothstep(15.0, 22.0, r);

        // Analytic funnel curvature shading (darkens steep funnel wall away from camera)
        float h = min(64.0, 0.07 * pow(2.65 / max(r, 0.5), 10.0));
        float dhdr = (h < 63.9) ? (-10.0 * h / max(r, 0.5)) : 0.0;
        vec3 N = normalize(vec3(-dhdr * cos(vTheta), 1.0, dhdr * sin(vTheta)));
        vec3 V = normalize(cameraPosition - vWorldPos);
        float ndotv = clamp(abs(dot(N, V)), 0.0, 1.0);
        float coreMask = bell(r, uWhite - 0.045, 0.14);
        float funnelShade = mix(0.32, 1.0, pow(ndotv, 0.52));
        color *= mix(funnelShade, 1.0, coreMask);

        // Aerial perspective: high-contrast foreground, cool atmospheric falloff in far distance
        float distFade = exp(-max(0.0, vDepth - 3.0) * 0.048);
        float nearBoost = 1.0 + 0.16 * exp(-max(0.0, vDepth - 1.4) * 0.55);
        vec3 farTint = color * vec3(0.76, 0.86, 1.08);
        color = mix(farTint, color, distFade) * (0.38 + 0.62 * distFade) * nearBoost;

        gl_FragColor = vec4(max(color, vec3(0.0)), 1.0);
      }
    `
  });

  const disc = new THREE.Mesh(discGeometry, discMaterial);
  disc.frustumCulled = false;
  scene.add(disc);

  // Volumetric atmospheric dust shell hovering slightly above the ring for 3D parallax thickness
  const haloMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uRadial: { value: radialTexture },
      uTime: { value: 0 },
      uWhite: { value: centerZ },
      uOuter: { value: outerRadius }
    },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying float vRadius;
      varying float vTheta;
      varying float vDepth;
      void main() {
        vRadius = uv.x;
        vTheta = uv.y;
        vec3 pos = position;
        pos.y += 0.022 + 0.012 * max(0.0, uv.x - 3.2);
        vec4 viewPos = modelViewMatrix * vec4(pos, 1.0);
        vDepth = -viewPos.z;
        gl_Position = projectionMatrix * viewPos;
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform sampler2D uRadial;
      uniform float uTime;
      uniform float uWhite;
      uniform float uOuter;
      varying float vRadius;
      varying float vTheta;
      varying float vDepth;

      float bell(float x, float center, float width) {
        float v = (x - center) / width;
        return exp(-v * v);
      }

      void main() {
        float r = vRadius;
        float theta = vTheta - uTime * 0.014 / pow(max(r, 0.5), 1.15);
        vec4 thread = texture2D(uRadial, vec2(r / 16.0, 0.5));
        float mist = 0.35 + 0.65 * sin(theta * 14.0 + r * 19.0) * 0.5 + 0.5;
        vec3 col = vec3(0.04, 0.14, 0.34) * bell(r, uWhite - 0.38, 0.45);
        col += vec3(0.45, 0.55, 0.72) * bell(r, uWhite - 0.045, 0.14);
        col += vec3(0.32, 0.04, 0.01) * bell(r, uWhite + 0.12, 0.14);
        col += vec3(0.24, 0.03, 0.01) * bell(r, uOuter, 0.22);
        float fade = exp(-max(0.0, vDepth - 2.5) * 0.07) * (1.0 - smoothstep(12.0, 19.0, r));
        gl_FragColor = vec4(col * thread.a * mist * fade * 0.22, 1.0);
      }
    `
  });
  const discHalo = new THREE.Mesh(discGeometry, haloMaterial);
  discHalo.frustumCulled = false;
  discHalo.renderOrder = 2;
  scene.add(discHalo);

  // Optimized orbiting dust particles (leaner count for smooth 60fps laptop wallpaper performance)
  const particleCount = lightDevice ? 75000 : 165000;
  const particlePositions = new Float32Array(particleCount * 3);
  const particleColors = new Float32Array(particleCount * 3);
  const particleData = new Float32Array(particleCount * 2);

  for (let i = 0; i < particleCount; i++) {
    const kind = random();
    let r, angle, elevation;
    const sign = random() < 0.22 ? -0.45 : 1.0;
    if (kind < 0.16) {
      r = 2.05 + random() * 1.4;
      angle = random() * TAU;
      elevation = sign * (0.003 + Math.pow(random(), 4.2) * 0.065);
    } else if (kind < 0.35) {
      r = 3.15 + random() * 0.85;
      angle = random() * TAU;
      elevation = sign * (0.003 + Math.pow(random(), 4.2) * 0.11);
    } else if (kind < 0.77) {
      r = 3.95 + Math.pow(random(), 1.35) * 12.0;
      angle = random() * TAU;
      elevation = sign * (0.006 + Math.pow(random(), 3.2) * (0.10 + r * 0.038));
    } else {
      r = 3.0 + Math.pow(random(), 1.15) * 15.0;
      angle = random() * Math.PI;
      elevation = sign * (0.018 + Math.pow(random(), 2.4) * (0.15 + r * 0.042));
    }

    particlePositions[i * 3] = r;
    particlePositions[i * 3 + 1] = angle;
    particlePositions[i * 3 + 2] = elevation;

    const color = chooseColor(random());
    let brightness = 0.22 + Math.pow(random(), 2.2) * 1.45;
    if (random() < 0.018) brightness *= 2.0;

    particleColors[i * 3] = color[0] * brightness;
    particleColors[i * 3 + 1] = color[1] * brightness;
    particleColors[i * 3 + 2] = color[2] * brightness;

    particleData[i * 2] = 0.52 + Math.pow(random(), 2.7) * 1.55;
    particleData[i * 2 + 1] = random() * 100;
  }

  const particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
  particleGeometry.setAttribute('aData', new THREE.BufferAttribute(particleData, 2));

  const pointFragment = `
    precision highp float;
    varying vec3 vColor;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float d = dot(p, p);
      if (d > 1.0) discard;
      float core = exp(-d * 5.0);
      float halo = exp(-d * 2.1) * 0.14;
      float edge = 1.0 - smoothstep(0.72, 1.0, d);
      gl_FragColor = vec4(vColor, (core + halo) * edge);
    }
  `;

  const streakFragment = `
    precision highp float;
    varying vec3 vColor;
    varying vec2 vDir;
    varying float vStretch;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      vec2 rot = vec2(p.x * vDir.x + p.y * vDir.y, -p.x * vDir.y + p.y * vDir.x);
      rot.x /= vStretch;
      rot.y *= 1.55;
      float d = dot(rot, rot);
      if (d > 1.0) discard;
      float core = exp(-d * 4.8);
      float halo = exp(-d * 2.0) * 0.16;
      float edge = 1.0 - smoothstep(0.72, 1.0, d);
      gl_FragColor = vec4(vColor, (core + halo) * edge);
    }
  `;

  const particleMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: 1 },
      uCenter: { value: new THREE.Vector2(centerX, centerZ) }
    },
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      uniform float uTime;
      uniform float uPixelRatio;
      uniform vec2 uCenter;
      attribute vec2 aData;
      varying vec3 vColor;
      varying vec2 vDir;
      varying float vStretch;
      void main() {
        float r = position.x;
        float theta = position.y + uTime * 0.018 / pow(r, 0.85);
        float h = min(64.0, 0.07 * pow(2.65 / max(r, 0.5), 10.0));
        vec3 p = vec3(
          uCenter.x + r * cos(theta),
          h + position.z,
          -uCenter.y - r * sin(theta)
        );
        vec3 pNext = vec3(
          uCenter.x + r * cos(theta + 0.012),
          h + position.z,
          -uCenter.y - r * sin(theta + 0.012)
        );
        vec4 view = modelViewMatrix * vec4(p, 1.0);
        vec4 clip0 = projectionMatrix * view;
        vec4 clip1 = projectionMatrix * modelViewMatrix * vec4(pNext, 1.0);
        gl_Position = clip0;

        vec2 ndcDir = (clip1.xy / max(0.001, clip1.w)) - (clip0.xy / max(0.001, clip0.w));
        float dirLen = length(ndcDir);
        vDir = dirLen > 0.00001 ? normalize(vec2(ndcDir.x, -ndcDir.y)) : vec2(1.0, 0.0);
        float depth = max(0.8, -view.z);
        vStretch = clamp(1.15 + smoothstep(3.2, 7.5, r) * 1.45 * (2.5 / max(1.5, depth)), 1.0, 2.75);

        float size = aData.x * (0.62 + 1.45 / max(1.0, depth));
        gl_PointSize = clamp(size * (0.85 + 0.35 * vStretch) * uPixelRatio, 0.75, 5.2 * uPixelRatio);
        float twinkle = 0.82 + 0.18 * sin(aData.y * 2.13 + uTime * (0.28 + fract(aData.y) * 0.45));
        float depthFade = exp(-max(0.0, depth - 3.8) * 0.045);
        vColor = color * twinkle * min(1.0, size) * (0.45 + 0.55 * depthFade);
      }
    `,
    fragmentShader: streakFragment
  });

  const dust = new THREE.Points(particleGeometry, particleMaterial);
  dust.frustumCulled = false;
  dust.renderOrder = 3;
  scene.add(dust);

  // Deep-space starfield filling the open upper-right sky
  const starCount = Math.min(5400, Math.max(1800, Math.floor(window.innerWidth * window.innerHeight * 0.0022)));
  const starPositions = new Float32Array(starCount * 3);
  const starColors = new Float32Array(starCount * 3);
  const starData = new Float32Array(starCount * 2);
  const starVector = new THREE.Vector3();

  for (let i = 0; i < starCount; i++) {
    starVector.set(random() * 2 - 1, random() * 2 - 1, 0.5).unproject(camera);
    starVector.sub(camera.position).normalize().multiplyScalar(180 + random() * 700).add(camera.position);
    starPositions[i * 3] = starVector.x;
    starPositions[i * 3 + 1] = starVector.y;
    starPositions[i * 3 + 2] = starVector.z;

    const color = chooseColor(random());
    const brightness = 0.04 + Math.pow(random(), 3.8) * 0.68;
    starColors[i * 3] = color[0] * brightness;
    starColors[i * 3 + 1] = color[1] * brightness;
    starColors[i * 3 + 2] = color[2] * brightness;

    starData[i * 2] = 0.58 + Math.pow(random(), 4.8) * 1.45;
    starData[i * 2 + 1] = random() * TAU;
  }

  const starGeometry = new THREE.BufferGeometry();
  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
  starGeometry.setAttribute('aData', new THREE.BufferAttribute(starData, 2));

  const starMaterial = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: 1 } },
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      uniform float uTime;
      uniform float uPixelRatio;
      attribute vec2 aData;
      varying vec3 vColor;
      void main() {
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = max(0.75, aData.x * uPixelRatio);
        vColor = color * (0.84 + 0.16 * sin(uTime * 0.24 + aData.y)) * min(1.0, aData.x);
      }
    `,
    fragmentShader: pointFragment
  });

  const stars = new THREE.Points(starGeometry, starMaterial);
  stars.frustumCulled = false;
  stars.renderOrder = 1;
  scene.add(stars);

  // Lone traveler silhouetted on the lower-left white band with cast shadow
  const traveler = new THREE.Group();
  const travelerScale = 0.020 / 1.82;
  const footPosition = surfacePoint(0.1742, 0.842, 0.00006);
  traveler.position.copy(footPosition);
  traveler.rotation.y = -0.16;

  const coatMaterial = new THREE.MeshStandardMaterial({ color: 0x030405, roughness: 0.96, metalness: 0 });
  const packMaterial = new THREE.MeshStandardMaterial({ color: 0x05070a, roughness: 1 });
  const shoeMaterial = new THREE.MeshStandardMaterial({ color: 0x010102, roughness: 1 });
  const headMaterial = new THREE.MeshStandardMaterial({ color: 0x08090b, roughness: 1 });

  const sphereGeometry = new THREE.SphereGeometry(1, 10, 8);
  const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 1, 7);
  const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

  function ellipsoid(x, y, z, sx, sy, sz, material) {
    const mesh = new THREE.Mesh(sphereGeometry, material);
    mesh.position.set(x, y, z);
    mesh.scale.set(sx, sy, sz);
    traveler.add(mesh);
    return mesh;
  }

  function limb(a, b, r1, r2, material) {
    const start = new THREE.Vector3(...a);
    const end = new THREE.Vector3(...b);
    const geometry = Math.abs(r1 - r2) < 0.001
      ? cylinderGeometry
      : new THREE.CylinderGeometry(r2, r1, 1, 7);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(start).add(end).multiplyScalar(0.5);
    const length = start.distanceTo(end);
    if (geometry === cylinderGeometry) mesh.scale.set(r1, length, r1);
    else mesh.scale.set(1, length, 1);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.sub(start).normalize());
    traveler.add(mesh);
    return mesh;
  }

  ellipsoid(0, 1.20, 0, 0.145, 0.285, 0.105, coatMaterial);
  ellipsoid(0, 0.94, 0, 0.13, 0.14, 0.105, coatMaterial);
  limb([0, 1.39, 0], [0, 1.55, 0], 0.052, 0.05, coatMaterial);
  ellipsoid(-0.012, 1.655, -0.005, 0.105, 0.135, 0.105, headMaterial);
  ellipsoid(-0.025, 1.245, 0.125, 0.135, 0.225, 0.10, packMaterial);
  ellipsoid(-0.075, 1.31, 0.14, 0.07, 0.13, 0.085, packMaterial);
  limb([-0.075, 0.96, 0], [-0.10, 0.52, 0.065], 0.061, 0.046, coatMaterial);
  limb([-0.10, 0.52, 0.065], [-0.18, 0.09, 0.13], 0.043, 0.031, coatMaterial);
  limb([0.075, 0.96, 0], [0.13, 0.53, -0.035], 0.061, 0.044, coatMaterial);
  limb([0.13, 0.53, -0.035], [0.18, 0.08, -0.09], 0.043, 0.03, coatMaterial);
  limb([-0.13, 1.37, 0], [-0.225, 1.08, 0.055], 0.052, 0.037, coatMaterial);
  limb([-0.225, 1.08, 0.055], [-0.195, 0.91, 0.08], 0.038, 0.026, coatMaterial);
  limb([0.13, 1.37, 0], [0.245, 1.12, -0.035], 0.05, 0.035, coatMaterial);
  limb([0.245, 1.12, -0.035], [0.325, 1.25, -0.075], 0.034, 0.024, coatMaterial);
  ellipsoid(0.326, 1.25, -0.075, 0.032, 0.037, 0.03, headMaterial);
  limb([0.325, 0.025, -0.085], [0.325, 1.91, -0.075], 0.010, 0.007, shoeMaterial);

  for (const foot of [[-0.18, 0.05, 0.105], [0.18, 0.045, -0.115]]) {
    const boot = new THREE.Mesh(boxGeometry, shoeMaterial);
    boot.position.set(...foot);
    boot.scale.set(0.092, 0.075, 0.18);
    traveler.add(boot);
  }
  foreground.add(traveler);

  foreground.add(new THREE.AmbientLight(0x7497c1, 0.17));
  const rimLight = new THREE.DirectionalLight(0xc8e7ff, 0.72);
  rimLight.position.set(-3, 5, 2);
  foreground.add(rimLight);

  const reflectedLight = new THREE.PointLight(0xff5932, 0.35, 4, 2);
  reflectedLight.position.copy(footPosition).add(new THREE.Vector3(0.3, 0.1, -0.2));
  foreground.add(reflectedLight);

  const shadowGeometry = new THREE.BufferGeometry();
  shadowGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3));
  shadowGeometry.setAttribute('aOpacity', new THREE.BufferAttribute(new Float32Array([0.82, 0.78, 0.42, 0.52]), 1));
  shadowGeometry.setIndex([0, 1, 2, 0, 2, 3]);

  const shadowMaterial = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      attribute float aOpacity;
      varying float vOpacity;
      void main() {
        vOpacity = aOpacity;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying float vOpacity;
      void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, vOpacity); }
    `
  });

  const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);
  shadow.frustumCulled = false;
  foreground.add(shadow);

  // Sparse foreground dust motes drifting between camera and traveler
  const fgCount = 280;
  const fgPos = new Float32Array(fgCount * 3);
  const fgCol = new Float32Array(fgCount * 3);
  const fgData = new Float32Array(fgCount * 2);
  for (let i = 0; i < fgCount; i++) {
    const t = 0.25 + random() * 0.72;
    fgPos[i * 3] = footPosition.x * t + (random() - 0.5) * 1.6;
    fgPos[i * 3 + 1] = 0.05 + random() * 0.95;
    fgPos[i * 3 + 2] = footPosition.z * t + (random() - 0.5) * 0.8;
    const c = chooseColor(random());
    const b = 0.08 + Math.pow(random(), 3.0) * 0.36;
    fgCol[i * 3] = c[0] * b;
    fgCol[i * 3 + 1] = c[1] * b;
    fgCol[i * 3 + 2] = c[2] * b;
    fgData[i * 2] = 0.8 + random() * 1.8;
    fgData[i * 2 + 1] = random() * TAU;
  }
  const fgGeom = new THREE.BufferGeometry();
  fgGeom.setAttribute('position', new THREE.BufferAttribute(fgPos, 3));
  fgGeom.setAttribute('color', new THREE.BufferAttribute(fgCol, 3));
  fgGeom.setAttribute('aData', new THREE.BufferAttribute(fgData, 2));
  const fgDustMaterial = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: 1 } },
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      uniform float uTime;
      uniform float uPixelRatio;
      attribute vec2 aData;
      varying vec3 vColor;
      void main() {
        vec3 p = position;
        p.x += sin(uTime * 0.14 + aData.y) * 0.04;
        p.y += cos(uTime * 0.11 + aData.y * 1.3) * 0.02;
        vec4 view = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * view;
        gl_PointSize = clamp(aData.x * uPixelRatio * (1.2 / max(0.6, -view.z)), 0.8, 4.2 * uPixelRatio);
        vColor = color * (0.75 + 0.25 * sin(uTime * 0.4 + aData.y));
      }
    `,
    fragmentShader: pointFragment
  });
  const fgDust = new THREE.Points(fgGeom, fgDustMaterial);
  fgDust.frustumCulled = false;
  foreground.add(fgDust);

  function updateTraveler() {
    // Projection is strictly isotropic, so traveler and shadow use 1:1 proportions
    traveler.scale.set(travelerScale, travelerScale, travelerScale);

    const factor = 1.0;
    const reference = [
      [0.17383, 0.84215], [0.17492, 0.84240],
      [0.18815, 0.85045], [0.18735, 0.85062]
    ];
    const array = shadowGeometry.attributes.position.array;
    for (let i = 0; i < 4; i++) {
      const u = 0.1742 + (reference[i][0] - 0.1742) * (i > 1 ? factor : 1);
      const p = surfacePoint(u, reference[i][1], 0.00013);
      array[i * 3] = p.x;
      array[i * 3 + 1] = p.y;
      array[i * 3 + 2] = p.z;
    }
    shadowGeometry.attributes.position.needsUpdate = true;
  }

  // Restrained HDR bloom for luminous glow without washing out fine threads
  const hdr = renderer.capabilities.isWebGL2 &&
    !!renderer.extensions.get('EXT_color_buffer_float');
  const targetOptions = {
    type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
    format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    stencilBuffer: false
  };

  const sceneTarget = new THREE.WebGLRenderTarget(1, 1, targetOptions);
  const glowA = new THREE.WebGLRenderTarget(1, 1, { ...targetOptions, depthBuffer: false });
  const glowB = new THREE.WebGLRenderTarget(1, 1, { ...targetOptions, depthBuffer: false });

  const postScene = new THREE.Scene();
  const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
  postCamera.position.z = 1;

  const postVertex = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;

  const extractMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uImage: { value: sceneTarget.texture },
      uTexel: { value: new THREE.Vector2() }
    },
    depthTest: false,
    depthWrite: false,
    vertexShader: postVertex,
    fragmentShader: `
      uniform sampler2D uImage;
      uniform vec2 uTexel;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(uImage, vUv + uTexel * vec2(-0.75, -0.75)).rgb;
        c += texture2D(uImage, vUv + uTexel * vec2(0.75, -0.75)).rgb;
        c += texture2D(uImage, vUv + uTexel * vec2(-0.75, 0.75)).rgb;
        c += texture2D(uImage, vUv + uTexel * vec2(0.75, 0.75)).rgb;
        c *= 0.25;
        float light = max(c.r, max(c.g, c.b));
        gl_FragColor = vec4(c * smoothstep(0.72, 1.65, light), 1.0);
      }
    `
  });

  const blurMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uImage: { value: null },
      uDirection: { value: new THREE.Vector2() }
    },
    depthTest: false,
    depthWrite: false,
    vertexShader: postVertex,
    fragmentShader: `
      uniform sampler2D uImage;
      uniform vec2 uDirection;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(uImage, vUv).rgb * 0.227027;
        c += texture2D(uImage, vUv + uDirection * 1.384615).rgb * 0.316216;
        c += texture2D(uImage, vUv - uDirection * 1.384615).rgb * 0.316216;
        c += texture2D(uImage, vUv + uDirection * 3.230769).rgb * 0.070270;
        c += texture2D(uImage, vUv - uDirection * 3.230769).rgb * 0.070270;
        gl_FragColor = vec4(c, 1.0);
      }
    `
  });

  const compositeMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uImage: { value: sceneTarget.texture },
      uGlow: { value: glowA.texture },
      uHDR: { value: hdr ? 1 : 0 }
    },
    depthTest: false,
    depthWrite: false,
    vertexShader: postVertex,
    fragmentShader: `
      precision highp float;
      uniform sampler2D uImage;
      uniform sampler2D uGlow;
      uniform float uHDR;
      varying vec2 vUv;
      void main() {
        vec3 base = texture2D(uImage, vUv).rgb;
        vec3 glow = texture2D(uGlow, vUv).rgb;
        // Subtle depth-of-field softness toward the far upper corners while keeping foreground razor sharp
        float farMask = smoothstep(0.35, 1.05, length((vUv - vec2(0.32, 0.28)) * vec2(1.0, 1.25)));
        vec3 color = mix(base, glow * 0.85 + base * 0.35, farMask * 0.14) + glow * 0.24;
        // Gentle cinematic vignette anchoring the lower-left foreground
        float vig = 1.0 - 0.18 * smoothstep(0.55, 1.35, length(vUv - vec2(0.45, 0.52)));
        color *= vig;
        if (uHDR > 0.5) {
          color = pow(max(vec3(0.0), vec3(1.0) - exp(-color * 1.28)), vec3(0.90)) * 1.012;
        } else {
          color = pow(clamp(color, 0.0, 1.0), vec3(0.92));
        }
        float noise = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
        color += noise * 0.0025 * smoothstep(0.015, 0.2, max(color.r, max(color.g, color.b)));
        gl_FragColor = vec4(max(color, vec3(0.0)), 1.0);
      }
    `
  });

  const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMaterial);
  postQuad.frustumCulled = false;
  postScene.add(postQuad);

  let lastInteraction = performance.now();
  let needsRender = true;

  // Render-scale knob: 1.0 = original quality. 0.85 trims ~28% of every
  // resolution-scaled GPU buffer (scene target, canvas, swap chain, raster tiles).
  const RENDER_SCALE = 0.85;

  function resize() {
    const { w, h } = getViewportSize();
    const pixelRatio = RENDER_SCALE * Math.min(
      Math.max(window.devicePixelRatio || 1, 1.15),
      lightDevice ? 1.35 : 1.5,
      Math.sqrt(3600000 / (w * h))
    );
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(w, h, false);

    const size = renderer.getDrawingBufferSize(new THREE.Vector2());
    sceneTarget.setSize(size.x, size.y);
    const gw = Math.max(1, Math.round(size.x * 0.32));
    const gh = Math.max(1, Math.round(size.y * 0.32));
    glowA.setSize(gw, gh);
    glowB.setSize(gw, gh);

    extractMaterial.uniforms.uTexel.value.set(1 / size.x, 1 / size.y);
    particleMaterial.uniforms.uPixelRatio.value = pixelRatio;
    starMaterial.uniforms.uPixelRatio.value = pixelRatio;
    fgDustMaterial.uniforms.uPixelRatio.value = pixelRatio;

    updateProjection();
    updateTraveler();
    needsRender = true;
  }

  resize();
  window.addEventListener('resize', resize, { passive: true });

  function render() {
    renderer.autoClear = true;
    renderer.setRenderTarget(sceneTarget);
    renderer.render(scene, camera);

    postQuad.material = extractMaterial;
    renderer.setRenderTarget(glowA);
    renderer.render(postScene, postCamera);

    postQuad.material = blurMaterial;
    blurMaterial.uniforms.uImage.value = glowA.texture;
    blurMaterial.uniforms.uDirection.value.set(1.12 / glowA.width, 0);
    renderer.setRenderTarget(glowB);
    renderer.render(postScene, postCamera);

    blurMaterial.uniforms.uImage.value = glowB.texture;
    blurMaterial.uniforms.uDirection.value.set(0, 1.12 / glowA.height);
    renderer.setRenderTarget(glowA);
    renderer.render(postScene, postCamera);

    postQuad.material = compositeMaterial;
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCamera);

    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(foreground, camera);
    renderer.autoClear = true;
  }

  // Live Wallpaper interaction (double-click or R to reset view)
  let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function toggleMotion() {
    playing = !playing;
    needsRender = true;
  }

  const desired = { yaw: 0, pitch: 0, distance: 4 };
  const current = { yaw: 0, pitch: 0, distance: 4 };
  const parallaxTarget = { yaw: 0, pitch: 0 };
  const parallaxCurrent = { yaw: 0, pitch: 0 };

  function resetView() {
    desired.yaw = 0;
    desired.pitch = 0;
    desired.distance = 4;
    lastInteraction = performance.now();
    needsRender = true;
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  canvas.addEventListener('dblclick', resetView);

  const pointers = new Map();
  let pinchDistance = 0;

  canvas.addEventListener('pointerdown', (event) => {
    if (event.button !== 0 && event.pointerType === 'mouse') return;
    canvas.focus({ preventScroll: true });
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    canvas.classList.add('dragging');
    lastInteraction = performance.now();
    if (pointers.size === 2) {
      const p = [...pointers.values()];
      pinchDistance = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    }
  });

  canvas.addEventListener('pointermove', (event) => {
    const { w, h } = getViewportSize();
    if (!pointers.has(event.pointerId)) {
      parallaxTarget.yaw = ((event.clientX / w) - 0.5) * 0.036;
      parallaxTarget.pitch = (0.5 - (event.clientY / h)) * 0.020;
      needsRender = true;
      return;
    }
    const old = pointers.get(event.pointerId);
    const dx = event.clientX - old.x;
    const dy = event.clientY - old.y;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    lastInteraction = performance.now();

    if (pointers.size === 1) {
      desired.yaw = clamp(desired.yaw - (dx / w) * 1.45, -0.72, 0.72);
      desired.pitch = clamp(desired.pitch + (dy / h) * 0.65, -0.115, 0.48);
    } else if (pointers.size === 2) {
      const p = [...pointers.values()];
      const distance = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (pinchDistance > 0 && distance > 0) {
        desired.distance = clamp((desired.distance * pinchDistance) / distance, 2.65, 7);
      }
      pinchDistance = distance;
    }
    needsRender = true;
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinchDistance = 0;
    if (!pointers.size) canvas.classList.remove('dragging');
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);

  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    desired.distance = clamp(desired.distance * Math.exp(clamp(event.deltaY, -180, 180) * 0.0008), 2.65, 7);
    lastInteraction = performance.now();
    needsRender = true;
  }, { passive: false });

  window.addEventListener('keydown', (event) => {
    if (event.target instanceof HTMLButtonElement && (event.code === 'Space' || event.code === 'Enter')) return;
    lastInteraction = performance.now();
    if (event.code === 'Space') {
      event.preventDefault();
      toggleMotion();
    } else if (event.key.toLowerCase() === 'r' || event.key === 'Home') {
      resetView();
    } else if (event.key.toLowerCase() === 'f') {
      toggleFullscreen();
    } else if (event.key === 'ArrowLeft') {
      desired.yaw = clamp(desired.yaw - 0.035, -0.72, 0.72);
    } else if (event.key === 'ArrowRight') {
      desired.yaw = clamp(desired.yaw + 0.035, -0.72, 0.72);
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      desired.pitch = clamp(desired.pitch + 0.025, -0.115, 0.48);
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      desired.pitch = clamp(desired.pitch - 0.025, -0.115, 0.48);
    } else if (event.key === '+' || event.key === '=') {
      desired.distance = clamp(desired.distance * 0.94, 2.65, 7);
    } else if (event.key === '-') {
      desired.distance = clamp(desired.distance * 1.06, 2.65, 7);
    }
    needsRender = true;
  });

  // Live wallpaper animation loop with idle frame-rate throttling (30fps when idle, 60fps when interacting)
  let elapsed = 0;
  let previousTime = performance.now();
  let lastRenderTime = 0;
  let animationFrame = 0;

  function animate(now) {
    animationFrame = requestAnimationFrame(animate);
    const dt = Math.min((now - previousTime) / 1000, 0.05);
    previousTime = now;

    if (playing) elapsed += dt;

    const smoothing = 1 - Math.exp(-dt * 7);
    const pChange = Math.abs(parallaxTarget.yaw - parallaxCurrent.yaw) +
      Math.abs(parallaxTarget.pitch - parallaxCurrent.pitch);
    const change = Math.abs(desired.yaw - current.yaw) +
      Math.abs(desired.pitch - current.pitch) +
      Math.abs(desired.distance - current.distance) + pChange;

    const isInteracting = pointers.size > 0 || change > 0.0005 || (now - lastInteraction) < 1200;
    // Deep idle: after 90s untouched, drop to 15fps — halves GPU wake-ups while you're away
    const deepIdle = pointers.size === 0 && (now - lastInteraction) > 90000;
    const targetInterval = isInteracting ? 16 : deepIdle ? 66 : 33; // 60 active / 30 idle / 15 deep idle

    if (!needsRender && change <= 0.000005 && (now - lastRenderTime) < targetInterval) {
      return;
    }

    current.yaw += (desired.yaw - current.yaw) * smoothing;
    current.pitch += (desired.pitch - current.pitch) * smoothing;
    current.distance += (desired.distance - current.distance) * smoothing;
    const pSmooth = 1 - Math.exp(-dt * 4.5);
    parallaxCurrent.yaw += (parallaxTarget.yaw - parallaxCurrent.yaw) * pSmooth;
    parallaxCurrent.pitch += (parallaxTarget.pitch - parallaxCurrent.pitch) * pSmooth;

    if (playing || needsRender || change > 0.000005) {
      const effYaw = current.yaw + parallaxCurrent.yaw;
      const effPitch = clamp(current.pitch + parallaxCurrent.pitch, -0.115, 0.48);
      const cp = Math.cos(effPitch);
      camera.position.set(
        Math.sin(effYaw) * cp * current.distance,
        1 + Math.sin(effPitch) * current.distance,
        -4 + Math.cos(effYaw) * cp * current.distance
      );
      camera.lookAt(lookTarget);
      camera.updateMatrixWorld(true);

      discMaterial.uniforms.uTime.value = elapsed;
      haloMaterial.uniforms.uTime.value = elapsed;
      particleMaterial.uniforms.uTime.value = elapsed;
      starMaterial.uniforms.uTime.value = elapsed;
      fgDustMaterial.uniforms.uTime.value = elapsed;

      render();
      lastRenderTime = now;
      needsRender = false;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(animationFrame);
    } else {
      previousTime = performance.now();
      needsRender = true;
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(animate);
    }
  });

  render();
  animationFrame = requestAnimationFrame(animate);
})();
</script>
</body>
</html>
