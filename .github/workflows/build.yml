# Builds livecanvas.exe + livecanvas-setup.exe on every push to main, on
# version tags (v*) and on manual dispatch from the Actions tab.
# Tag runs also attach both exes to a GitHub Release, so users can download
# a ready-to-run installer without installing Rust.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache ~/.cargo and target/ keyed on Cargo.lock; first run is cold,
      # later runs reuse compiled dependencies.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        shell: pwsh
        run: cargo clippy --workspace -- -D warnings

      # Runs unit tests, then builds both binaries into .\dist
      # (see build.ps1 — the installer embeds the app as its payload).
      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livecanvas-windows-x64
          path: dist/*
          if-no-files-found: error

      # Only tag pushes (v1.2.3) create a GitHub Release with the exes.
      - name: Attach exes to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
